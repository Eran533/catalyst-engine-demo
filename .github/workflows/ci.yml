name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .[dev]
      - run: pytest -q
      - name: smoke-run the demo
        run: |
          python scripts/make_demo_data.py --out /tmp/demo
          python -m catalyst_demo --data /tmp/demo run --date 2026-09-04 --dry-run
